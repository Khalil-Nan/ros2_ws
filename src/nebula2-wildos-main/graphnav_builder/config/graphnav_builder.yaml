graphnav_builder:
  ros__parameters:
    odom_topic: odom
    grid_map_topic: traversability_map
    nav_graph_topic: nav_graph
    traversability_layer: ""
    trav_class: default
    safe_threshold: 0.5
    planning_radius: 10.0
    local_map_resolution: 0.1
    max_free_radius: 4.0
    traversable_radius: 0.4
    edge_radius: 8.0
    num_samples: 1000
    publish_edge_debug_markers: true
    edge_debug_marker_topic: graphnav_edge_debug_markers
    edge_debug_z_offset: 0.12
    edge_debug_max_segments_per_class: 20000
    edge_debug_neighbor_explored_radius_factor: 2.0
    random_seed: 7
